# ============================================================
# compose.prod.yaml — vidasaludable (producción en Hetzner)
# ============================================================
# Uso (en el servidor, dentro de /opt/vidasaludable):
#   docker compose -f compose.prod.yaml up -d --build
# El backend expone 8091 y Vercel lo alcanza server-to-server vía rewrites
# (/api/* → http://100.111.99.61:8091). La BD SQLite persiste en ./data.
# ============================================================

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8091
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data:/app/data
      # admin-video-analyze: YouTube cookies for yt-dlp live under the data
      # volume (/app/data/secrets/youtube-cookies.txt, referenced by
      # YT_COOKIES_PATH in the host .env) — NOT a dedicated ro mount:
      # media.ts copies the master to a disposable "<path>.run" sibling per
      # extraction (yt-dlp dumps its pruned jar INTO THAT COPY — the master
      # is never the --cookies target, see spec Log L8), so the directory
      # must be writable and an OSError 30 (read-only file system) would
      # abort extraction. Host dirs stay OUTSIDE git (data/ and secrets/
      # are gitignored).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
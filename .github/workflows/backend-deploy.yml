# Build + push the backend image to GHCR as a CI verification (Dockerfile.prod
# still builds, image archived by sha). The REAL production deploy runs through
# deploy-webhook.service on the server (GitHub push webhook → git pull →
# docker compose build → up), which is the only path that reaches Hetzner:
# HETZNER_HOST is a Tailscale IP, unreachable from GitHub-hosted runners (the
# old SSH deploy job failed with "dial tcp :22: i/o timeout" on every run).
name: Build Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "compose.prod.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

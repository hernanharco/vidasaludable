
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <!-- T1/S2b — warm up the font origins before the stylesheet asks for the
           inlined @font-face files (src/styles/index.css). `crossorigin` on
           fonts.gstatic.com matches how the woff2 files are fetched (CORS). -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <title>Salud Preventiva — Bienestar integral y prevención</title>
    <!-- Social preview (Open Graph + Twitter): what WhatsApp/Messenger/Telegram
         render when the URL is pasted. og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Salud Preventiva" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Salud Preventiva — Bienestar integral y prevención" />
    <meta
      property="og:description"
      content="Nutrición celular, suplementación estratégica y hábitos sostenibles. Hacé tu análisis de bienestar en línea y recibí recomendaciones personalizadas."
    />
    <meta property="og:url" content="https://vidasaludable.rincom.es/" />
    <meta property="og:image" content="https://vidasaludable.rincom.es/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Salud Preventiva — Bienestar integral y prevención"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Salud Preventiva — Bienestar integral y prevención" />
    <meta
      name="twitter:description"
      content="Nutrición celular, suplementación estratégica y hábitos sostenibles. Hacé tu análisis de bienestar en línea y recibí recomendaciones personalizadas."
    />
    <meta name="twitter:image" content="https://vidasaludable.rincom.es/og-image.jpg" />
    <meta name="theme-color" content="#065f46" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>
